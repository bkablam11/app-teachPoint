name: teachpoint
description: "Application de pointage, cahier de texte et vacation pour enseignants vacataires."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gestion d'état stable (Riverpod 2.x)
  flutter_riverpod: ^2.6.1

  # Base de données locale stable pour SDK 34/35 (sans le bug Baklava 36)
  sqflite: 2.3.3+1
  path: ^1.9.0

  # Réseau & Détection (mis à niveau pour SDK 35)
  dio: ^5.4.1
  connectivity_plus: ^6.0.5

  # Informations système & installation directe (mis à niveau pour Kotlin récent)
  package_info_plus: ^8.0.0
  open_filex: ^4.7.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0

  # Utilitaires & UI
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  uuid: ^4.3.3

  # Génération PDF A4
  pdf: ^3.11.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

